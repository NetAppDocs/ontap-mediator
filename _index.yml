indexpage:
  title: ONTAP Mediator documentation
  lead: ONTAP Mediator supports ONTAP features by providing a persistent and fenced store for high-availability (HA) metadata, synchronous node health query functionality to aid in quorum determination, and serving as a ping proxy for controller liveliness. In SnapMirror active sync relationships, ONTAP Mediator acts as the quorum witness, ensuring transparent failover while reducing the operational complexity of maintaining and managing a third site. In MetroCluster IP configurations, ONTAP Mediator can implement a Mediator-assisted unplanned switchover (MAUSO) in the case of a disaster.
