indexpage:
  title: ONTAP Mediator documentation
  lead: ONTAP Mediator supports ONTAP features by providing a persistent and fenced store for high-availability (HA) metadata, serving as a ping proxy for controller liveliness, and providing synchronous node health query functionality to aid in quorum determination.  ONTAP Mediator can be configured to monitor SnapMirror active sync relationships and MetroCluster IP configurations. In MetroCluster IP, ONTAP Mediator can implement a Mediator-assisted unplanned switchover (MAUSO) in the case of a disaster.
  summary: ONTAP Mediator supports ONTAP features by providing a persistent and fenced store for high-availability (HA) metadata, serving as a ping proxy for controller liveliness, and providing synchronous node health query functionality to aid in quorum determination.  ONTAP Mediator can be configured to monitor SnapMirror active sync relationships and MetroCluster IP configurations. In MetroCluster IP, ONTAP Mediator can implement a Mediator-assisted unplanned switchover (MAUSO) in the case of a disaster. 
