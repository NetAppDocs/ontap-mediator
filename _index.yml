indexpage:
  title: ONTAP Mediator 
  lead: ONTAP Mediator is an external service application that assists NetApp ONTAP features—such as MetroCluster IP configurations and SnapMirror active sync—by providing third-party arbitrated health checks, startup/shutdown control, and automated failover capabilities.
